# AppVeyor CI configuration for the Vite + React + ExcelJS application.
version: 1.0.{build}

image: Visual Studio 2022

environment:
  nodejs_version: "24.19.0"

install:
  # Node.js 24 does not publish a 32-bit Windows build. Download the exact x64 runtime
  # instead of AppVeyor's default x86 Install-Product selection.
  - ps: Update-NodeJsInstallation $env:nodejs_version x64
  - node --version
  - npm --version
  - npm ci

# This project has no Visual Studio solution; run the npm quality checks instead.
build: off
build_script:
  - npm run lint
  - npm run build

# Keep the production Vite output available from successful CI builds.
artifacts:
  - path: dist
    name: exceljs-learning-lab
